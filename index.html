<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Docsmio keeps personal documents in a private wallet and offers separate PDF and image tools. Files stay private unless you share them."
    />
    <meta name="theme-color" content="#070b09" />
    <script>
      try {
        var storedMode = localStorage.getItem('docsmio.app.mode')
        document.documentElement.dataset.appMode = storedMode === 'tools' ? 'tools' : 'wallet'
      } catch (error) {
        document.documentElement.dataset.appMode = 'wallet'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Docsmio — Document Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
